services:
  - type: web
    name: crusaders-api
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migration:run:prod
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health/ready
    disk:
      name: crusaders-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      - key: FRONTEND_DOMAIN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: UPLOADS_DIR
        value: /opt/render/project/src/uploads
      - key: SHOW_ERROR_DETAILS
        value: "false"
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_JWT_TOKEN_EXPIRES_IN
        value: 15m
      - key: AUTH_REFRESH_SECRET
        generateValue: true
      - key: AUTH_REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      - key: AUTH_JWT_ISSUER
        value: crusaders-api
      - key: AUTH_JWT_AUDIENCE
        value: crusaders-web
      - key: DATABASE_URL
        fromDatabase:
          name: crusaders-db
          property: connectionString
      - key: DATABASE_SYNCHRONIZE
        value: "false"
      - key: DATABASE_MAX_CONNECTIONS
        value: "20"
      - key: DATABASE_SSL_ENABLED
        value: "false"
      - key: DATABASE_REJECT_UNAUTHORIZED
        value: "false"
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_NAME
        value: Crusaders
      - key: MAIL_DEFAULT_EMAIL
        sync: false

databases:
  - name: crusaders-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: crusaders
    user: crusaders_app
    ipAllowList: []
